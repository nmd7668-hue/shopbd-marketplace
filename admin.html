<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ShopBD Admin Panel</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 16px;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #172033;
    }

    .container {
      max-width: 850px;
      margin: 15px auto;
      padding: 20px;
      background: white;
      border-radius: 14px;
      box-shadow: 0 4px 18px #0001;
    }

    h1, h2 { color: #087443; }

    input, textarea, select, button {
      width: 100%;
      padding: 12px;
      margin: 7px 0;
      border-radius: 8px;
      font-size: 16px;
    }

    input, textarea, select {
      border: 1px solid #cbd5e1;
    }

    button {
      border: 0;
      background: #087443;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button.secondary { background: #475569; }
    button.danger { background: #b42318; }
    button.edit { background: #2563eb; }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .message {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .card {
      border: 1px solid #dbe3ec;
      border-radius: 10px;
      padding: 14px;
      margin: 12px 0;
      overflow-wrap: anywhere;
    }

    .tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin: 15px 0;
    }

    .tabs button { font-size: 14px; }
    .tabs button.active { background: #064e3b; }

    .section { margin-top: 20px; }

    [hidden] { display: none !important; }

    img {
      max-width: 100%;
      max-height: 150px;
      object-fit: contain;
    }

    #forgot-password-button {
      background: #2563eb;
    }
  </style>
</head>

<body>

  <!-- ShopBD Logo -->
  <a class="brand" href="index.html">
    <img
      src="./IMG_20261031_123506.jpg"
      alt="ShopBD Logo"
      style="width:160px; max-width:45vw; height:auto;"
    >
  </a>

  <!-- বাকি পেজের কোড এখানে থাকবে -->

</body>
<main class="container">

  <h1>ShopBD Admin Panel</h1>

  <!-- LOGIN -->
  <section id="login-section">

    <h2>অ্যাডমিন লগইন</h2>

    <form id="login-form">

      <label>অ্যাডমিন Gmail</label>
      <input
        id="email"
        type="email"
        required
        autocomplete="username"
      >

      <label>পাসওয়ার্ড</label>
      <input
        id="password"
        type="password"
        required
        autocomplete="current-password"
      >

      <button id="login-button" type="submit">
        Login
      </button>

    </form>

    <!-- FORGOT PASSWORD -->
    <button
      id="forgot-password-button"
      type="button">
      Forgot Password?
    </button>

    <p id="login-message" class="message" role="status"></p>

  </section>

  <!-- ADMIN DASHBOARD -->
  <section id="admin-dashboard" hidden>

    <h2>অ্যাডমিন ড্যাশবোর্ড</h2>

    <button
      id="logout-button"
      class="secondary"
      type="button">
      Logout
    </button>

    <div class="tabs">

      <button class="active" data-tab="products-section">
        পণ্য
      </button>

      <button data-tab="sellers-section">
        বিক্রেতা
      </button>

      <button data-tab="orders-section">
        অর্ডার
      </button>

    </div>

    <!-- PRODUCTS -->
    <section id="products-section" class="section">

      <h2>পণ্য যোগ / সম্পাদনা</h2>

      <form id="product-form">

        <input id="editing-product-id" type="hidden">

        <label>পণ্যের নাম</label>
        <input id="product-name" maxlength="100" required>

        <label>দাম</label>
        <input
          id="product-price"
          type="number"
          min="0"
          step="0.01"
          required
        >

        <label>ছবির URL</label>
        <input id="product-image" type="url">

        <label>বিবরণ</label>
        <textarea id="product-description"></textarea>

        <button id="add-product-button" type="submit">
          পণ্য যোগ করুন
        </button>

        <button
          id="cancel-edit-button"
          class="secondary"
          type="button"
          hidden>
          সম্পাদনা বাতিল
        </button>

      </form>

      <p id="product-message" class="message"></p>

      <h2>পণ্যের তালিকা</h2>
      <div id="product-list"></div>

    </section>

    <!-- SELLERS -->
    <section id="sellers-section" class="section" hidden>

      <h2>বিক্রেতার আবেদন</h2>

      <p id="seller-message" class="message"></p>
      <div id="seller-list"></div>

    </section>

    <!-- ORDERS -->
    <section id="orders-section" class="section" hidden>

      <h2>গ্রাহকের অর্ডার</h2>

      <p id="order-message" class="message"></p>
      <div id="order-list"></div>

    </section>

  </section>

</main>

<script type="module" src="./admin.js"></script>

</body>
</html>
