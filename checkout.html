<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ShopBD - অর্ডার করুন</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 16px;
      font-family: Arial, sans-serif;
      background: #f3f6f9;
      color: #172033;
    }
    main {
      max-width: 650px;
      margin: 20px auto;
      background: white;
      padding: 20px;
      border-radius: 14px;
      box-shadow: 0 3px 15px #0001;
    }
    h1, h2 { color: #087443; }
    label { display: block; margin-top: 12px; font-weight: bold; }
    input, textarea, select, button {
      width: 100%;
      padding: 12px;
      margin-top: 6px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 16px;
    }
    button {
      background: #087443;
      color: white;
      border: 0;
      cursor: pointer;
      font-weight: bold;
    }
    button:disabled { opacity: .6; cursor: wait; }
    .product {
      padding: 12px;
      margin: 10px 0;
      border: 1px solid #dbe3ec;
      border-radius: 8px;
    }
    .product img { max-width: 100%; max-height: 160px; }
    .message { white-space: pre-wrap; overflow-wrap: anywhere; }
    .note { background: #f0fdf4; padding: 12px; border-radius: 8px; }
  </style>
</head>
<body>
<main>
  <h1>ShopBD — অর্ডার করুন</h1>
  <p>পণ্য নির্বাচন করে আপনার ডেলিভারি তথ্য দিন।</p>

  <section>
    <h2>পণ্য নির্বাচন</h2>
    <div id="product-list">পণ্য লোড হচ্ছে…</div>
  </section>

  <form id="order-form">
    <h2>ডেলিভারি তথ্য</h2>

    <label for="customer-name">আপনার নাম</label>
    <input id="customer-name" maxlength="100" required>

    <label for="customer-phone">মোবাইল নম্বর</label>
    <input id="customer-phone" type="tel" maxlength="20"
           autocomplete="tel" required>

    <label for="customer-address">সম্পূর্ণ ডেলিভারি ঠিকানা</label>
    <textarea id="customer-address" maxlength="500"
              rows="3" required></textarea>

    <label for="payment-method">পেমেন্ট পদ্ধতি</label>
    <select id="payment-method" required>
      <option value="COD">Cash on Delivery (পণ্য পেয়ে টাকা দিন)</option>
    </select>

    <div class="note">
      অর্ডারের মোট দাম: <strong id="total-price">৳0</strong>
      <p>ডেলিভারি চার্জ থাকলে দোকানের পক্ষ থেকে নিশ্চিত করা হবে।</p>
    </div>

    <button id="submit-order" type="submit">অর্ডার নিশ্চিত করুন</button>
    <p id="order-message" class="message" role="status"></p>
  </form>
</main>

<script type="module" src="./checkout.js"></script>
</body>
</html>
